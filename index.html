<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R100 Bot · RSI & Bollinger Pro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 700px; margin: auto; }
        h2 { color: #ff444f; text-align: center; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #aaa; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; background: #2c2c2c; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 20px; cursor: pointer; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .btn-connect { background: #007bff; color: white; }
        .btn-start { background: #28a745; color: white; }
        .btn-stop { background: #dc3545; color: white; display: none; }
        #status { text-align: center; margin-top: 10px; font-weight: bold; color: #ffc107; }
        .log-box { height: 200px; overflow-y: scroll; background: #000; padding: 10px; font-family: monospace; font-size: 13px; margin-top: 20px; border: 1px solid #333; }
        .stats { display: flex; justify-content: space-between; background: #252525; padding: 10px; border-radius: 6px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>R100 Bot Automático</h2>
    
    <!-- Sección de Conexión -->
    <div id="login-panel">
        <label>API Token (Deriv):</label>
        <input type="password" id="apiToken" placeholder="Pega aquí tu token (Read & Trade)">
        <button class="btn-connect" onclick="connectBot()">Conectar Cuenta</button>
        <div id="status">Estado: Esperando...</div>
    </div>

    <!-- Sección del Bot (Oculta hasta conectar) -->
    <div id="bot-panel" style="display:none;">
        <div class="stats">
            <span>Balance: <b id="balanceDisplay">$0.00</b></span>
            <span>P&L Sesión: <b id="plDisplay">$0.00</b></span>
        </div>

        <label>Símbolo:</label>
        <select id="symbol"><option value="R_100">Volatility 100 Index</option></select>
        
        <div style="display: flex; gap: 10px;">
            <div><label>Monto ($)</label><input type="number" id="stake" value="1"></div>
            <div><label>Take Profit ($)</label><input type="number" id="tp" value="10"></div>
            <div><label>Stop Loss ($)</label><input type="number" id="sl" value="10"></div>
        </div>

        <button class="btn-start" id="btnStart" onclick="toggleBot()">▶ INICIAR BOT</button>
        <button class="btn-stop" id="btnStop" onclick="toggleBot()">⏹ DETENER BOT</button>
    </div>

    <div class="log-box" id="logs">Sistema listo. Conecta tu cuenta para comenzar.</div>
</div>

<script src="https://unpkg.com/@deriv/deriv-api/dist/DerivAPIBasic.js"></script>
<script>
    let api, ws, isRunning = false, balance = 0, sessionPL = 0;
    const APP_ID = 1089; 

    function log(msg) {
        const div = document.getElementById('logs');
        div.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        div.scrollTop = div.scrollHeight;
    }

    async function connectBot() {
        const token = document.getElementById('apiToken').value.trim();
        if (!token) return alert("Por favor, ingresa tu API Token.");

        document.getElementById('status').innerText = "Estado: Conectando...";
        log("Intentando conexión con Deriv...");

        try {
            ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);
            
            ws.onopen = () => {
                api = new DerivAPI.Basic({ connection: ws });
                api.authorize(token).then(() => {
                    document.getElementById('login-panel').style.display = 'none';
                    document.getElementById('bot-panel').style.display = 'block';
                    document.getElementById('status').innerText = "Estado: Conectado ✅";
                    log("✅ Cuenta autorizada correctamente.");
                    getBalance();
                }).catch(err => {
                    log("❌ Error de autorización: " + err.message);
                    document.getElementById('status').innerText = "Estado: Error en Token";
                });
            };

            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);
                if (data.msg_type === 'balance') {
                    balance = data.balance.balance;
                    document.getElementById('balanceDisplay').innerText = `$${balance}`;
                }
                if (data.msg_type === 'proposal_open_contract' && data.proposal_open_contract.is_sold) {
                    const profit = parseFloat(data.proposal_open_contract.profit);
                    sessionPL += profit;
                    document.getElementById('plDisplay').innerText = `$${sessionPL.toFixed(2)}`;
                    log(`Operación cerrada. Resultado: $${profit}`);
                    checkLimits();
                }
            };

        } catch (e) {
            log("Error de red: " + e);
        }
    }

    function toggleBot() {
        isRunning = !isRunning;
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        
        if (isRunning) {
            btnStart.style.display = 'none';
            btnStop.style.display = 'block';
            log("🟢 Bot iniciado. Monitoreando mercado...");
            // Aquí iría la lógica de monitoreo de ticks
        } else {
            btnStart.style.display = 'block';
            btnStop.style.display = 'none';
            log("🔴 Bot detenido.");
        }
    }

    function getBalance() {
        api.send({ balance: 1, subscribe: 1 });
    }

    function checkLimits() {
        const tp = parseFloat(document.getElementById('tp').value);
        const sl = parseFloat(document.getElementById('sl').value);
        if (sessionPL >= tp) {
            toggleBot();
            log("🏆 ¡Take Profit alcanzado! Sesión finalizada.");
        }
        if (sessionPL <= -sl) {
            toggleBot();
            log("🛑 ¡Stop Loss alcanzado! Sesión finalizada.");
        }
    }
</script>
</body>
</html>
