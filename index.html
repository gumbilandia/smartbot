<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>R100 Bot Pro · RSI & Bollinger</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1e1e1e; color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 10px; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; background: #3d3d3d; border: 1px solid #555; color: white; border-radius: 5px; }
        button { width: 100%; padding: 12px; margin-top: 10px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; }
        .btn-connect { background: #00a8ff; color: white; }
        .btn-start { background: #2ecc71; color: white; }
        .btn-stop { background: #e74c3c; color: white; display: none; }
        .stats { display: flex; justify-content: space-between; margin: 15px 0; font-size: 14px; background: #333; padding: 10px; border-radius: 5px; }
        #logs { height: 150px; overflow-y: scroll; background: #111; padding: 10px; font-family: monospace; font-size: 12px; margin-top: 15px; border: 1px solid #444; }
        .indicator-val { color: #f1c40f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center;">🤖 R100 Bot Automático</h2>
    
    <div id="login-section">
        <label>API Token (Read & Trade):</label>
        <input type="password" id="token" placeholder="Pega tu token aquí">
        <button class="btn-connect" onclick="initConnection()">Conectar Cuenta</button>
    </div>

    <div id="bot-section" style="display:none;">
        <div class="stats">
            <span>Balance: <b id="bal">$0.00</b></span>
            <span>P&L Sesión: <b id="pl">$0.00</b></span>
        </div>

        <div class="stats">
            <span>RSI Actual: <b id="rsi-val" class="indicator-val">--</b></span>
            <span>Bollinger: <b id="bb-val" class="indicator-val">--</b></span>
        </div>

        <label>Monto ($): <input type="number" id="stake" value="1"></label>
        <label>Take Profit ($): <input type="number" id="tp" value="10"></label>
        <label>Stop Loss ($): <input type="number" id="sl" value="10"></label>

        <button class="btn-start" id="btnStart" onclick="startBot()">▶ INICIAR BOT AUTOMÁTICO</button>
        <button class="btn-stop" id="btnStop" onclick="stopBot()">⏹ DETENER</button>
    </div>

    <div id="logs">Esperando conexión...</div>
</div>

<!-- Librerías Oficiales y de Cálculo -->
<script src="https://unpkg.com/@deriv/deriv-api/dist/DerivAPIBasic.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/technicalindicators/3.1.0/index.browser.js"></script>

<script>
    let api, ws, isRunning = false, ticks = [], balance = 0, sessionPL = 0;
    const APP_ID = 1089; 

    function log(msg) {
        const div = document.getElementById('logs');
        div.innerHTML += `<div>${new Date().toLocaleTimeString()} ${msg}</div>`;
        div.scrollTop = div.scrollHeight;
    }

    async function initConnection() {
        const token = document.getElementById('token').value;
        if(!token) return alert("Falta el token");

        ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);
        ws.onopen = () => {
            api = new DerivAPI.Basic({ connection: ws });
            api.authorize(token).then(() => {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('bot-section').style.display = 'block';
                log("✅ Conectado exitosamente.");
                getBalance();
                startTickStream();
            }).catch(e => log("❌ Error: " + e.message));
        };
        
        ws.onmessage = (msg) => {
            const data = JSON.parse(msg.data);
            if(data.msg_type === 'balance') {
                balance = data.balance.balance;
                document.getElementById('bal').innerText = `$${balance}`;
            }
            if(data.msg_type === 'proposal_open_contract' && data.proposal_open_contract.is_sold) {
                const profit = parseFloat(data.proposal_open_contract.profit);
                sessionPL += profit;
                document.getElementById('pl').innerText = `$${sessionPL.toFixed(2)}`;
                log(`Operación cerrada: ${profit > 0 ? 'GANANCIA' : 'PÉRDIDA'} $${profit}`);
                checkLimits();
            }
        };
    }

    function startTickStream() {
        api.send({ ticks: 'R_100', subscribe: 1 });
        ws.onmessage = (msg) => {
            const data = JSON.parse(msg.data);
            if(data.msg_type === 'tick') {
                const price = parseFloat(data.tick.quote);
                ticks.push(price);
                if(ticks.length > 20) calculateIndicators(); // Esperamos 20 ticks para tener datos
            }
            // Manejo de respuestas de balance y contratos cerrados
            if(data.msg_type === 'balance') {
                balance = data.balance.balance;
                document.getElementById('bal').innerText = `$${balance}`;
            }
            if(data.msg_type === 'proposal_open_contract' && data.proposal_open_contract.is_sold) {
                const profit = parseFloat(data.proposal_open_contract.profit);
                sessionPL += profit;
                document.getElementById('pl').innerText = `$${sessionPL.toFixed(2)}`;
                log(`Operación finalizada: ${profit}`);
                checkLimits();
            }
        };
    }

    function calculateIndicators() {
        // Configuración RSI
        const rsiInput = { values: ticks, period: 14 };
        const rsiResult = technicalindicators.RSI.calculate(rsiInput);
        const currentRSI = rsiResult[rsiResult.length - 1];

        // Configuración Bollinger
        const bbInput = { values: ticks, period: 20, stdDev: 2 };
        const bbResult = technicalindicators.BollingerBands.calculate(bbInput);
        const currentBB = bbResult[bbResult.length - 1];

        if(currentRSI && currentBB) {
            document.getElementById('rsi-val').innerText = currentRSI.toFixed(2);
            document.getElementById('bb-val').innerText = `U:${currentBB.upper.toFixed(2)} L:${currentBB.lower.toFixed(2)}`;
            
            if(isRunning) analyzeSignal(currentRSI, currentBB, ticks[ticks.length-1]);
        }
    }

    function analyzeSignal(rsi, bb, currentPrice) {
        // ESTRATEGIA AUTOMÁTICA MEJORADA
        // CALL (Rise): RSI muy bajo (< 7) Y Precio toca o rompe la banda inferior
        if (rsi < 7 && currentPrice <= bb.lower) {
            executeTrade('CALL');
        }
        // PUT (Fall): RSI muy alto (> 93) Y Precio toca o rompe la banda superior
        else if (rsi > 93 && currentPrice >= bb.upper) {
            executeTrade('PUT');
        }
    }

    async function executeTrade(type) {
        isRunning = false; // Pausa brevemente para no enviar múltiples órdenes
        log(`🚀 Señal detectada (${type}). Ejecutando...`);
        
        const proposal = await api.send({
            proposal: 1,
            amount: document.getElementById('stake').value,
            basis: 'stake',
            contract_type: type === 'CALL' ? 'CALL' : 'PUT',
            currency: 'USD',
            duration: 5,
            duration_unit: 't',
            symbol: 'R_100'
        });

        if(proposal.proposal) {
            await api.send({ buy: proposal.proposal.id, price: proposal.proposal.ask_price });
            log("✅ Orden enviada al mercado.");
        }
        
        setTimeout(() => { isRunning = true; }, 6000); // Reactiva después de 6 segundos
    }

    function startBot() {
        isRunning = true;
        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnStop').style.display = 'block';
        log("🟢 Bot AUTOMÁTICO activado. Esperando señales de RSI+Bollinger...");
    }

    function stopBot() {
        isRunning = false;
        document.getElementById('btnStart').style.display = 'block';
        document.getElementById('btnStop').style.display = 'none';
        log("🔴 Bot detenido.");
    }

    function checkLimits() {
        const tp = parseFloat(document.getElementById('tp').value);
        const sl = parseFloat(document.getElementById('sl').value);
        if(sessionPL >= tp || sessionPL <= -sl) {
            stopBot();
            log(`⚠️ Límite alcanzado (TP/SL). Sesión finalizada.`);
        }
    }
</script>
</body>
</html>
